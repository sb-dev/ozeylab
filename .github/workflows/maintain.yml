name: Maintain project candidates
on:
  schedule:
    - cron: '17 7 * * 1'
  push:
    paths:
      - 'projects/**/sources/**'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project ID; leave empty for due projects'
        required: false
        type: string
      process:
        type: choice
        default: case-study-maintain
        options:
          - case-study-create
          - case-study-maintain
          - project-maintain
          - project-name
          - domain-check
permissions:
  contents: read
concurrency:
  group: ozeylab-maintenance
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Install your chosen runner here before enabling automation.json.
      # Give its provider credential the environment name the runner expects.
      - name: Prepare or execute bounded work
        env:
          OZEYLAB_PROJECT: ${{ inputs.project }}
          OZEYLAB_PROCESS: ${{ inputs.process }}
          NAMECOM_USERNAME: ${{ secrets.NAMECOM_USERNAME }}
          NAMECOM_TOKEN: ${{ secrets.NAMECOM_TOKEN }}
        run: node scripts/automation.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-candidate
          path: outputs/
          retention-days: 7
